# ============================================================
# Nixpacks — build e arranque do backend na nuvem (Railway)
# Este ficheiro fica na RAIZ do repositório. O Railway deteta-o
# automaticamente e usa estes comandos em vez de adivinhar.
# ============================================================

[phases.install]
cmds = ["cd backend && npm ci --no-audit --no-fund"]

[phases.build]
cmds = ["echo \"Build do backend: dependências instaladas\""]

[start]
cmd = "node backend/src/scripts/bootstrap.js && node backend/server.js"
